http:
  middlewares:
    # spike 07 임시: 방화벽을 전체에 열었으므로 모든 라우터 앞에 basicAuth (fake-auth 는 비밀번호가 없다)
    spike-gate:
      basicAuth:
        usersFile: /acme/basic-users
        removeHeader: true
    strip-identity:
      headers:
        customRequestHeaders:
          X-Forwarded-User: ""
          X-Openclaw-Scopes: ""
          X-Kacp-User: ""
    kacp-auth:
      forwardAuth:
        address: http://fake-auth:4000/verify
        trustForwardHeader: false
        authResponseHeaders:
          - X-Forwarded-User
          - X-Openclaw-Scopes
    claw-frame:
      plugin:
        cspframe:
          frameAncestors: "'self'"
    strip-session-cookie:
      plugin:
        cookiestrip:
          names: ["kacp_session", "kacp_dev_user"]
    secure-headers:
      headers:
        stsSeconds: 31536000
        contentTypeNosniff: true

  routers:
    # 인증서: 라우터에 tls 를 적지 않는다 → websecure 진입점의 http.tls(certresolver + kacp.cloud/*.kacp.cloud)를 물려받는다.
    # 라우터에 tls: {} 를 적으면 빈 값이라도 진입점 설정을 덮어써 인증서가 발급되지 않는다(spike 07).
    apex:
      rule: Host(`kacp.cloud`) || Host(`app.kacp.cloud`)
      entryPoints: [websecure]
      priority: 50
      middlewares: [spike-gate, secure-headers]
      service: whoami
    auth-ui:
      rule: Host(`team1.kacp.cloud`) && PathPrefix(`/_kacp`)
      entryPoints: [websecure]
      priority: 100
      middlewares: [spike-gate, secure-headers]
      service: fake-auth
    debug-echo:
      rule: Host(`team1.kacp.cloud`) && PathPrefix(`/_debug`)
      entryPoints: [websecure]
      priority: 90
      middlewares: [spike-gate, strip-identity, kacp-auth, strip-session-cookie, secure-headers]
      service: whoami
    team1:
      rule: Host(`team1.kacp.cloud`) && PathPrefix(`/claw`)
      entryPoints: [websecure]
      priority: 70
      middlewares: [spike-gate, strip-identity, kacp-auth, claw-frame, secure-headers]
      service: openclaw-team1
    shell:
      rule: Host(`team1.kacp.cloud`)
      entryPoints: [websecure]
      priority: 1
      middlewares: [spike-gate, strip-identity, kacp-auth, secure-headers]
      service: fake-auth

  services:
    fake-auth:
      loadBalancer:
        servers: [{ url: "http://fake-auth:4000" }]
    whoami:
      loadBalancer:
        servers: [{ url: "http://whoami:80" }]
    openclaw-team1:
      loadBalancer:
        servers: [{ url: "http://openclaw-team1:18789" }]
