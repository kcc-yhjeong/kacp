server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Hashed build assets never change.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Developer tools (create-platform-mcp). Public: no secrets, needed before any login (npx).
    location /tools/ {
        try_files $uri =404;
        types { application/gzip tgz; }
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: every host and path renders index.html; the app picks the screen from the host.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
