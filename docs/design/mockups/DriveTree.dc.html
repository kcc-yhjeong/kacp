<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<aside style="width:240px;height:100%;box-sizing:border-box;display:flex;flex-direction:column;background:oklch(0.985 0 0);border-right:1px solid oklch(0.922 0 0);font-family:Inter,'Pretendard Variable',Pretendard,-apple-system,'Segoe UI','Malgun Gothic',sans-serif;font-size:13.5px;color:oklch(0.145 0 0)">
  <div style="flex:1;display:flex;flex-direction:column;gap:1px;padding:12px 8px">
    <sc-for list="{{ rows }}" as="r" hint-placeholder-count="9">
      <sc-if value="{{ r.gap }}" hint-placeholder-val="{{ false }}"><div style="height:10px"></div></sc-if>
      <div style="display:flex;align-items:center;gap:6px;height:30px;padding-left:{{ r.pad }};padding-right:8px;border-radius:6px;cursor:pointer;background:{{ r.bg }};font-weight:{{ r.weight }}" style-hover="background:oklch(0.97 0 0)">
        <span style="width:14px;display:grid;place-items:center;color:oklch(0.556 0 0)"><sc-if value="{{ r.open }}" hint-placeholder-val="{{ false }}"><dc-import name="Icon" n="chevron-down" size="14" hint-size="14px,14px"></dc-import></sc-if><sc-if value="{{ r.closed }}" hint-placeholder-val="{{ false }}"><dc-import name="Icon" n="chevron-right" size="14" hint-size="14px,14px"></dc-import></sc-if></span>
        <dc-import name="Icon" n="{{ r.icon }}" color="{{ r.iconColor }}" hint-size="16px,16px"></dc-import>
        <span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ r.label }}</span>
      </div>
    </sc-for>
  </div>
  <div style="display:flex;flex-direction:column;gap:8px;padding:16px;border-top:1px solid oklch(0.922 0 0)">
    <div style="display:flex;justify-content:space-between;font-size:12px"><span style="color:oklch(0.556 0 0)">팀 사용량</span><span style="font-variant-numeric:tabular-nums">{{ usage }}</span></div>
    <div style="height:4px;border-radius:2px;background:oklch(0.922 0 0);overflow:hidden"><div style="height:100%;width:{{ usagePct }};background:{{ usageColor }}"></div></div>
  </div>
</aside>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:240,&quot;height&quot;:600},&quot;sel&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;me&quot;,&quot;reports&quot;,&quot;campaign&quot;,&quot;drafts&quot;,&quot;shared&quot;,&quot;treports&quot;,&quot;events&quot;,&quot;design&quot;,&quot;minutes&quot;,&quot;trash&quot;],&quot;default&quot;:&quot;reports&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;full&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const sel = this.props.sel ?? 'reports';
    const full = this.props.full ?? false;
    const base = [
      ['me', '내 드라이브', 'hard-drive', 0, 'open'], ['reports', '보고서', 'folder', 1, 'closed'], ['campaign', '캠페인 2026', 'folder', 1, 'closed'], ['drafts', '초안', 'folder', 1, ''],
      ['shared', '팀 공유', 'users', 0, 'open', true], ['treports', '캠페인 보고서', 'folder', 1, 'closed'], ['events', '이벤트', 'folder', 1, 'closed'], ['design', '디자인 에셋', 'folder', 1, 'closed'], ['minutes', '회의록', 'folder', 1, 'closed'],
      ['trash', '휴지통', 'trash', 0, '', true],
    ];
    const rows = base.map(([k, label, icon, d, st, gap]) => ({
      label, icon, gap: !!gap, open: st === 'open', closed: st === 'closed',
      pad: (8 + d * 16) + 'px', bg: k === sel ? 'oklch(0.97 0 0)' : 'transparent', weight: k === sel ? 500 : 400,
      iconColor: k === sel ? 'oklch(0.145 0 0)' : 'oklch(0.556 0 0)',
    }));
    return { rows, usage: full ? '19.8 GB / 20 GB' : '12.4 GB / 20 GB', usagePct: full ? '99%' : '62%', usageColor: full ? 'oklch(0.586 0.253 17.585)' : 'oklch(0.205 0 0)' };
  }
}
</script>
</body>
</html>
