<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;align-items:flex-start;width:100%;font-family:Inter,'Pretendard Variable',Pretendard,-apple-system,'Segoe UI','Malgun Gothic',sans-serif">
  <sc-for list="{{ items }}" as="s" hint-placeholder-count="4">
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px;flex:1;min-width:0;position:relative">
      <sc-if value="{{ s.hasLine }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;z-index:0;top:11px;right:50%;width:100%;height:2px;background:{{ s.lineColor }}"></div></sc-if>
      <sc-if value="{{ s.done }}" hint-placeholder-val="{{ false }}"><div style="position:relative;z-index:1;width:24px;height:24px;border-radius:50%;background:oklch(0.205 0 0);display:grid;place-items:center;color:#fff"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg></div></sc-if>
      <sc-if value="{{ s.current }}" hint-placeholder-val="{{ false }}"><div style="position:relative;z-index:1;width:24px;height:24px;box-sizing:border-box;border-radius:50%;background:#fff;border:2px solid oklch(0.205 0 0);display:grid;place-items:center"><span style="width:8px;height:8px;border-radius:50%;background:oklch(0.205 0 0)"></span></div></sc-if>
      <sc-if value="{{ s.todo }}" hint-placeholder-val="{{ true }}"><div style="position:relative;z-index:1;width:24px;height:24px;box-sizing:border-box;border-radius:50%;background:#fff;border:2px solid oklch(0.922 0 0)"></div></sc-if>
      <sc-if value="{{ s.failed }}" hint-placeholder-val="{{ false }}"><div style="position:relative;z-index:1;width:24px;height:24px;border-radius:50%;background:oklch(0.586 0.253 17.585);display:grid;place-items:center;color:#fff"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></div></sc-if>
      <div style="display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center">
        <span style="font-size:12.5px;font-weight:{{ s.weight }};color:{{ s.textColor }};white-space:nowrap">{{ s.label }}</span>
        <span style="font-size:11px;color:oklch(0.556 0 0);white-space:nowrap;font-variant-numeric:tabular-nums">{{ s.sub }}</span>
      </div>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:480,&quot;height&quot;:80},&quot;steps&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{label:string,state:'done'|'current'|'todo'|'failed',sub?:string}[]&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const steps = this.props.steps ?? [
      { label: '요청됨', state: 'done', sub: '3분 전' }, { label: '검토 중', state: 'current' }, { label: '승인', state: 'todo' }, { label: '공개됨', state: 'todo' },
    ];
    const items = steps.map((s, i) => {
      const prev = steps[i - 1];
      return {
        ...s, sub: s.sub ?? '',
        done: s.state === 'done', current: s.state === 'current', todo: s.state === 'todo', failed: s.state === 'failed',
        hasLine: i > 0,
        lineColor: prev && prev.state === 'done' ? 'oklch(0.205 0 0)' : 'oklch(0.922 0 0)',
        weight: s.state === 'current' || s.state === 'failed' ? 500 : 400,
        textColor: s.state === 'todo' ? 'oklch(0.556 0 0)' : 'oklch(0.145 0 0)',
      };
    });
    return { items };
  }
}
</script>
</body>
</html>
