<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap"><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"><style>body{margin:0;background:#fff;font-family:Inter,'Pretendard Variable',Pretendard,-apple-system,'Segoe UI','Malgun Gothic',sans-serif;color:oklch(0.145 0 0);word-break:keep-all}a{color:oklch(0.145 0 0);text-decoration:none}a:hover{color:oklch(0.205 0 0)}</style></helmet>
<div style="max-width:1080px;margin:0 auto;padding:48px 24px 64px;display:flex;flex-direction:column;gap:32px">
  <div style="display:flex;align-items:center;gap:12px">
    <div style="width:32px;height:32px;border-radius:8px;background:oklch(0.205 0 0);color:#fff;display:grid;place-items:center;font-weight:700;font-size:15px">K</div>
    <div style="display:flex;flex-direction:column;gap:2px"><span style="font-size:24px;font-weight:700;letter-spacing:-0.025em">KACP 화면 시안 목차</span><span style="font-size:14px;color:oklch(0.556 0 0)">01-screens.md 화면 ID 기준 · shadcn neutral · 1280 기준(관리자 1440)</span></div>
  </div>
  <sc-for list="{{ groups }}" as="g" hint-placeholder-count="4">
    <div style="display:flex;flex-direction:column;gap:12px">
      <span style="font-size:14px;font-weight:600">{{ g.t }}</span>
      <div style="border:1px solid oklch(0.922 0 0);border-radius:12px;overflow:hidden">
        <sc-for list="{{ g.items }}" as="i" hint-placeholder-count="4">
          <a href="{{ i.href }}" style="display:grid;grid-template-columns:168px minmax(0,1fr) minmax(0,1.2fr) 20px;align-items:center;column-gap:16px;min-height:52px;padding:8px 20px;box-sizing:border-box;border-bottom:1px solid oklch(0.922 0 0)" style-hover="background:oklch(0.985 0 0)">
            <span style="font-family:'Geist Mono',ui-monospace,monospace;font-size:12.5px;font-weight:500">{{ i.ids }}</span>
            <span style="font-size:14px;font-weight:500">{{ i.name }}</span>
            <span style="font-size:12.5px;color:oklch(0.556 0 0);line-height:1.5">{{ i.note }}</span>
            <dc-import name="Icon" n="chevron-right" color="oklch(0.556 0 0)" hint-size="16px,16px"></dc-import>
          </a>
        </sc-for>
      </div>
    </div>
  </sc-for>
  <div style="display:flex;flex-direction:column;gap:12px">
    <span style="font-size:14px;font-weight:600">공용 부품</span>
    <div style="display:flex;flex-wrap:wrap;gap:8px">
      <sc-for list="{{ parts }}" as="p" hint-placeholder-count="6"><a href="{{ p.href }}" style="height:32px;padding:0 12px;box-sizing:border-box;border:1px solid oklch(0.922 0 0);border-radius:6px;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500"><span style="font-family:'Geist Mono',ui-monospace,monospace;font-size:12px">{{ p.n }}</span><span style="color:oklch(0.556 0 0);font-weight:400">{{ p.d }}</span></a></sc-for>
    </div>
  </div>
</div>
</x-dc>
