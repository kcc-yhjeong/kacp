openapi: 3.1.0
info:
  title: KACP API
  version: 0.1.0-draft
  description: |
    KCC Agent Cloud Platform 외부 API (0단계 초안).
    규칙과 내부 API는 docs/design/04-api.md 참고.
    상태 변경 요청은 X-KACP-CSRF 헤더가 필요하다.
servers:
  - url: https://app.kacp.cloud/api/v1
security:
  - session: []
tags:
  - name: auth
  - name: me
  - name: org
  - name: names
  - name: teams
  - name: drive
  - name: apps
  - name: mcp
  - name: posts
  - name: admin

paths:
  # ───────────── auth ─────────────
  /auth/login:
    post:
      tags: [auth]
      security: []
      summary: 로그인
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: 성공. Set-Cookie kacp_session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /auth/logout:
    post:
      tags: [auth]
      summary: 로그아웃
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      responses:
        '204': { description: 완료 }
  /auth/me:
    get:
      tags: [auth]
      summary: 내 정보
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
          description: OK
        '401': { $ref: '#/components/responses/Error' }
  /auth/password:
    post:
      tags: [auth]
      summary: 비밀번호 변경 (첫 로그인 포함)
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newPassword]
              properties:
                currentPassword: { type: string, description: 첫 로그인 설정 세션이면 생략 }
                newPassword: { type: string, minLength: 10 }
      responses:
        '204': { description: 변경됨. 다른 세션 폐기 }
        '400': { $ref: '#/components/responses/Error' }

  # ───────────── me ─────────────
  /me/teams:
    get:
      tags: [me]
      summary: 소속 팀
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/MyTeam' }
  /me/sessions:
    get:
      tags: [me]
      summary: 내 로그인 세션
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/SessionInfo' }
    delete:
      tags: [me]
      summary: 현재 세션 외 모두 로그아웃
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      responses:
        '204': { description: 완료 }
  /me/notifications:
    get:
      tags: [me]
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Notification' }
  /me/notifications/unread-count:
    get:
      tags: [me]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }
  /me/notifications/read:
    post:
      tags: [me]
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ids: { type: array, items: { type: string, format: uuid } }
                all: { type: boolean }
      responses:
        '204': { description: 완료 }
  /me/mcp/packages:
    get:
      tags: [mcp]
      summary: 내가 올린 MCP 패키지와 버전
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/McpPackageSummary'
                        - properties:
                            versions:
                              type: array
                              items: { $ref: '#/components/schemas/McpVersion' }

  # ───────────── org ─────────────
  /departments:
    get:
      tags: [org]
      summary: 부서 트리 (선택 화면용)
      parameters:
        - { name: includeArchived, in: query, schema: { type: boolean, default: false }, description: 관리자만 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/DepartmentNode' }
  /users/search:
    get:
      tags: [org]
      summary: 사람 찾기 (멤버 추가용)
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: departmentId, in: query, schema: { type: string, format: uuid } }
        - { name: includeDescendants, in: query, schema: { type: boolean, default: true } }
      responses:
        '200':
          description: 최대 20명
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/UserRef' }

  # ───────────── names ─────────────
  /names/check:
    get:
      tags: [names]
      parameters:
        - { name: name, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  available: { type: boolean }
                  reason:
                    type: [string, 'null']
                    enum: [NAME_INVALID, NAME_RESERVED, NAME_TAKEN, null]
  /names/{name}:
    get:
      tags: [names]
      security: []
      summary: 호스트 분류 (web 404 판단용)
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  hostKind: { type: string, enum: [team, public_app, private_app, none], description: "호스트 분류(names.kind와 다른 값)" }
                  running: { type: boolean }

  # ───────────── teams ─────────────
  /teams/{team}:
    parameters: [{ $ref: '#/components/parameters/Team' }]
    get:
      tags: [teams]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamDetail' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /teams/{team}/status:
    parameters: [{ $ref: '#/components/parameters/Team' }]
    get:
      tags: [teams]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamStatus' }
  /teams/{team}/session:
    parameters: [{ $ref: '#/components/parameters/Team' }]
    post:
      tags: [teams]
      summary: 에이전트 셸 진입 — 기동 보장 + presence 등록
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      responses:
        '200':
          description: 이미 실행 중
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamStatus' }
        '202':
          description: 기동 시작
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamStatus' }
  /teams/{team}/heartbeat:
    parameters: [{ $ref: '#/components/parameters/Team' }]
    post:
      tags: [teams]
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      responses:
        '204': { description: OK }
  /teams/{team}/members:
    parameters: [{ $ref: '#/components/parameters/Team' }]
    get:
      tags: [teams]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Member' }
    post:
      tags: [teams]
      summary: 멤버 추가 (팀 관리자)
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: email 하나 또는 userIds 여러 명
              properties:
                email: { type: string, format: email }
                userIds: { type: array, items: { type: string, format: uuid } }
                teamRole: { $ref: '#/components/schemas/TeamRole' }
      responses:
        '201':
          description: 추가됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /teams/{team}/members/{userId}:
    parameters:
      - { $ref: '#/components/parameters/Team' }
      - { $ref: '#/components/parameters/UserId' }
    patch:
      tags: [teams]
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [teamRole]
              properties:
                teamRole: { $ref: '#/components/schemas/TeamRole' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
    delete:
      tags: [teams]
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      responses:
        '204': { description: 제거됨 }
        '409': { $ref: '#/components/responses/Error' }

  # ───────────── drive ─────────────
  /teams/{team}/drive/list:
    parameters: [{ $ref: '#/components/parameters/Team' }]
    get:
      tags: [drive]
      parameters:
        - { $ref: '#/components/parameters/Space' }
        - { $ref: '#/components/parameters/DrivePath' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  path: { type: string }
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/DriveEntry' }
  /teams/{team}/drive/search:
    parameters: [{ $ref: '#/components/parameters/Team' }]
    get:
      tags: [drive]
      parameters:
        - { $ref: '#/components/parameters/Space' }
        - { name: q, in: query, required: true, schema: { type: string, minLength: 1 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/DriveEntry' }
  /teams/{team}/drive/meta:
    parameters: [{ $ref: '#/components/parameters/Team' }]
    get:
      tags: [drive]
      parameters:
        - { $ref: '#/components/parameters/Space' }
        - { $ref: '#/components/parameters/DrivePath' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriveMeta' }
  /teams/{team}/drive/download:
    parameters: [{ $ref: '#/components/parameters/Team' }]
    get:
      tags: [drive]
      parameters:
        - { $ref: '#/components/parameters/Space' }
        - { $ref: '#/components/parameters/DrivePath' }
        - { name: inline, in: query, schema: { type: boolean }, description: 미리보기용 Content-Disposition inline }
      responses:
        '200':
          description: 파일 스트림 (폴더는 application/zip)
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
  /teams/{team}/drive/download-zip:
    parameters: [{ $ref: '#/components/parameters/Team' }]
    post:
      tags: [drive]
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [space, paths]
              properties:
                space: { $ref: '#/components/schemas/Space' }
                paths: { type: array, items: { type: string } }
      responses:
        '200':
          description: zip 스트림
          content:
            application/zip:
              schema: { type: string, format: binary }
  /teams/{team}/drive/upload:
    parameters: [{ $ref: '#/components/parameters/Team' }]
    post:
      tags: [drive]
      parameters:
        - { $ref: '#/components/parameters/Csrf' }
        - { $ref: '#/components/parameters/Space' }
        - { $ref: '#/components/parameters/DrivePath' }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items: { type: string, format: binary }
                relativePaths:
                  type: array
                  items: { type: string }
                  description: 폴더 업로드 시 파일별 상대 경로
      responses:
        '201':
          description: 저장됨
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/DriveEntry' }
        '413': { $ref: '#/components/responses/Error' }
  /teams/{team}/drive/folder:
    parameters: [{ $ref: '#/components/parameters/Team' }]
    post:
      tags: [drive]
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DriveRef' }
      responses:
        '201':
          description: 생성됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriveEntry' }
        '409': { $ref: '#/components/responses/Error' }
  /teams/{team}/drive/rename:
    parameters: [{ $ref: '#/components/parameters/Team' }]
    post:
      tags: [drive]
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/DriveRef'
                - type: object
                  required: [newName]
                  properties:
                    newName: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriveEntry' }
  /teams/{team}/drive/move:
    parameters: [{ $ref: '#/components/parameters/Team' }]
    post:
      tags: [drive]
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DriveTransfer' }
      responses:
        '204': { description: 완료 }
  /teams/{team}/drive/copy:
    parameters: [{ $ref: '#/components/parameters/Team' }]
    post:
      tags: [drive]
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DriveTransfer' }
      responses:
        '204': { description: 완료 }
  /teams/{team}/drive/usage:
    parameters: [{ $ref: '#/components/parameters/Team' }]
    get:
      tags: [drive]
      summary: 팀 드라이브 사용량 (한도 = teams.resource_limits.diskGb)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  usedBytes: { type: integer }
                  limitBytes: { type: integer }
  /teams/{team}/drive/trash:
    parameters: [{ $ref: '#/components/parameters/Team' }]
    get:
      tags: [drive]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/TrashItem' }
    post:
      tags: [drive]
      summary: 휴지통으로 이동
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [space, paths]
              properties:
                space: { $ref: '#/components/schemas/Space' }
                paths: { type: array, items: { type: string } }
      responses:
        '204': { description: 완료 }
    delete:
      tags: [drive]
      summary: 휴지통 비우기 — 지운 사람 본인 항목만, 팀 관리자는 팀 공유 항목 전부
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      responses:
        '204': { description: 영구 삭제 }
  /teams/{team}/drive/trash/{id}/restore:
    parameters:
      - { $ref: '#/components/parameters/Team' }
      - { $ref: '#/components/parameters/Id' }
    post:
      tags: [drive]
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      responses:
        '200':
          description: 복원됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriveEntry' }
  /teams/{team}/drive/trash/{id}:
    parameters:
      - { $ref: '#/components/parameters/Team' }
      - { $ref: '#/components/parameters/Id' }
    delete:
      tags: [drive]
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      responses:
        '204': { description: 영구 삭제 }

  # ───────────── apps ─────────────
  /teams/{team}/apps:
    parameters: [{ $ref: '#/components/parameters/Team' }]
    get:
      tags: [apps]
      parameters:
        - { name: work, in: query, schema: { type: string, enum: [running, sleeping, stopped, error] }, description: "sleeping = stopped + stopReason idle·limit, stopped = stopped + stopReason manual·admin" }
        - { name: public, in: query, schema: { type: string, enum: [none, publish_pending, update_pending, live] }, description: "none = 미공개(대기 요청 없음), publish_pending = 공개 요청 대기, update_pending = 공개 중 + 업데이트 요청 대기, live = 공개 중(대기 없음)" }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  runningWorkCount: { type: integer }
                  runningWorkLimit: { type: integer }
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/App' }
  /public-apps:
    get:
      tags: [apps]
      summary: 공개 중인 앱 목록 (U-13 첨부 선택용)
      parameters:
        - { name: q, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/PublicAppSummary' }
  /apps/{appId}:
    parameters: [{ $ref: '#/components/parameters/AppId' }]
    get:
      tags: [apps]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppDetail' }
    delete:
      tags: [apps]
      summary: 앱 삭제 (팀 관리자)
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      responses:
        '202': { description: "삭제 진행 (두 사본·두 데이터, 원본 폴더 유지)" }
  /apps/{appId}/stats:
    parameters: [{ $ref: '#/components/parameters/AppId' }]
    get:
      tags: [apps]
      parameters:
        - { $ref: '#/components/parameters/CopyTarget' }
        - { name: range, in: query, schema: { type: string, enum: [1h, 24h], default: 1h } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Series' }
  /apps/{appId}/logs:
    parameters: [{ $ref: '#/components/parameters/AppId' }]
    get:
      tags: [apps]
      parameters:
        - { $ref: '#/components/parameters/CopyTarget' }
        - { name: tail, in: query, schema: { type: integer, default: 500, maximum: 5000 } }
      responses:
        '200':
          description: 로그 텍스트
          content:
            text/plain:
              schema: { type: string }
  /apps/{appId}/work/{action}:
    parameters:
      - { $ref: '#/components/parameters/AppId' }
      - { name: action, in: path, required: true, schema: { type: string, enum: [start, stop, restart] } }
    post:
      tags: [apps]
      summary: 작업본 제어
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      responses:
        '202':
          description: 접수
          content:
            application/json:
              schema: { $ref: '#/components/schemas/App' }
        '409': { $ref: '#/components/responses/Error' }
  /apps/{appId}/public/{action}:
    parameters:
      - { $ref: '#/components/parameters/AppId' }
      - { name: action, in: path, required: true, schema: { type: string, enum: [start, stop, restart] } }
    post:
      tags: [apps]
      summary: 공개본 제어 (관리자 강제 중지 상태면 409)
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      responses:
        '202':
          description: 접수
          content:
            application/json:
              schema: { $ref: '#/components/schemas/App' }
        '409': { $ref: '#/components/responses/Error' }
  /apps/{appId}/public-request:
    parameters: [{ $ref: '#/components/parameters/AppId' }]
    post:
      tags: [apps]
      summary: 공개 요청 — 미공개면 publish(name 필수), 공개 중이면 update
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                name: { $ref: '#/components/schemas/Name' }
                reason: { type: string, maxLength: 500, description: "publish: 공개 이유 / update: 변경 내용" }
      responses:
        '201':
          description: 요청됨
          content:
            application/json:
