      tags: [admin]
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      responses:
        '202': { description: 해제 반영 대기 }
  /admin/agent-templates:
    get:
      tags: [admin]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AgentTemplate' }
    post:
      tags: [admin]
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentTemplateInput' }
      responses:
        '201':
          description: 생성됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentTemplate' }
  /admin/agent-templates/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [admin]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentTemplate' }
    put:
      tags: [admin]
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentTemplateInput' }
      responses:
        '200':
          description: 저장됨(version +1, 할당 팀 pending)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentTemplate' }
    delete:
      tags: [admin]
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      responses:
        '204': { description: 삭제됨 }
        '409': { $ref: '#/components/responses/Error' }
  /admin/mcp/reviews:
    get:
      tags: [admin]
      responses:
        '200':
          description: 심사 대기 버전
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/McpVersion' }
  /admin/mcp/versions/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [admin]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/McpVersion'
                  - properties:
                      previous: { $ref: '#/components/schemas/McpVersion' }
                      scanFindings:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: string }
                            severity: { type: string, enum: [critical, high, medium, low] }
                            package: { type: string }
                            title: { type: string }
  /admin/mcp/versions/{id}/source:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [admin]
      responses:
        '200':
          description: 소스 zip
          content:
            application/zip:
              schema: { type: string, format: binary }
  /admin/mcp/versions/{id}/{decision}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
      - { name: decision, in: path, required: true, schema: { type: string, enum: [approve, reject] } }
    post:
      tags: [admin]
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string, description: 반려 시 필수 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/McpVersion' }
  /admin/mcp/packages:
    get:
      tags: [admin]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/McpPackageSummary' }
  /admin/mcp/packages/{pkg}/{action}:
    parameters:
      - { $ref: '#/components/parameters/Pkg' }
      - { name: action, in: path, required: true, schema: { type: string, enum: [suspend, resume] } }
    post:
      tags: [admin]
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                removeInstalls: { type: boolean, default: false }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/McpPackageSummary' }
  /admin/mcp/packages/{pkg}/default:
    parameters: [{ $ref: '#/components/parameters/Pkg' }]
    put:
      tags: [admin]
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [isDefault]
              properties:
                isDefault: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/McpPackageSummary' }
  /admin/mcp/installs:
    get:
      tags: [admin]
      parameters:
        - { name: team, in: query, schema: { type: string } }
        - { name: source, in: query, schema: { $ref: '#/components/schemas/McpInstallSource' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/McpInstall'
                        - properties:
                            team: { type: string }
  /admin/deploy-requests:
    get:
      tags: [admin]
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/DeployRequestStatus' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/DeployRequest'
                        - properties:
                            app: { $ref: '#/components/schemas/App' }
                            sourceFiles:
                              type: array
                              items: { $ref: '#/components/schemas/DriveEntry' }
                              description: publish일 때 원본 폴더 파일 목록
  /admin/deploy-requests/{id}/{decision}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
      - { name: decision, in: path, required: true, schema: { type: string, enum: [approve, reject] } }
    post:
      tags: [admin]
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string, description: 반려 시 필수 }
      responses:
        '202':
          description: 승인 → 공개 진행 / 반려 완료
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeployRequest' }
  /admin/apps:
    get:
      tags: [admin]
      parameters:
        - { name: public, in: query, schema: { type: boolean } }
        - { name: team, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/App' }
  /admin/apps/{appId}/public/{action}:
    parameters:
      - { $ref: '#/components/parameters/AppId' }
      - { name: action, in: path, required: true, schema: { type: string, enum: [force-stop, resume] } }
    post:
      tags: [admin]
      summary: 공개본 강제 중지·해제 (작업본 영향 없음)
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, description: force-stop 시 필수 }
      responses:
        '202': { description: 진행 }
  /admin/settings:
    get:
      tags: [admin]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlatformSettings' }
    put:
      tags: [admin]
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlatformSettings' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlatformSettings' }
  /admin/settings/api-keys/{provider}:
    parameters:
      - { name: provider, in: path, required: true, schema: { type: string } }
    put:
      tags: [admin]
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key]
              properties:
                key: { type: string }
      responses:
        '204': { description: 저장됨 }
  /admin/audit-events:
    get:
      tags: [admin]
      parameters:
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: actor, in: query, schema: { type: string, format: uuid } }
        - { name: action, in: query, schema: { type: string } }
        - { name: targetType, in: query, schema: { type: string } }
        - { name: team, in: query, schema: { type: string } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/AuditEvent' }

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: kacp_session

  parameters:
    Csrf:
      name: X-KACP-CSRF
      in: header
      required: true
      schema: { type: string }
    Team:
      name: team
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Name' }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AppId:
      name: appId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Id:
      name: id
      in: path
      required: true
      schema: { type: string }
    Pkg:
      name: pkg
      in: path
      required: true
      schema: { type: string }
    Space:
      name: space
      in: query
      required: true
      schema: { $ref: '#/components/schemas/Space' }
    DrivePath:
      name: path
      in: query
      required: true
      schema: { type: string, default: / }
    CopyTarget:
      name: target
      in: query
      schema: { $ref: '#/components/schemas/AppCopyKind' }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, default: 50, maximum: 200 }

  responses:
    Error:
      description: 오류
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, examples: [NAME_TAKEN] }
            message: { type: string, description: 사용자에게 보여줄 한국어 문구 }
            details: { type: object }
    Page:
      type: object
      properties:
        nextCursor: { type: [string, 'null'] }
    Name:
      type: string
      pattern: '^[a-z0-9](?:[a-z0-9]|-(?!-)){1,28}[a-z0-9]$'
      description: 3~30자, 소문자·숫자·하이픈, -- 금지
    Space:
      type: string
      enum: [me, shared]
    PlatformRole:
      type: string
      enum: [admin, user]
    TeamRole:
      type: string
      enum: [team_admin, member]
    TeamContainerStatus:
      type: string
      enum: [stopped, starting, running, stopping, error]
    AppStatus:
      type: string
      enum: [starting, running, stopped, error]
    AppCopyKind:
      type: string
      enum: [work, public]
      description: work = 작업본(Private), public = 공개본(Public)
    StopReason:
      type: string
      enum: [idle, limit, manual, admin]
      description: stopped일 때만 값이 있다. 오류는 status=error + statusDetail로 표현한다
    DeployRequestKind:
      type: string
      enum: [publish, update]
    DeployRequestStatus:
      type: string
      enum: [pending, approved, rejected, cancelled]
    McpVersionStatus:
      type: string
      enum: [uploaded, validating, building, scanning, testing, in_review, published, rejected, failed, superseded]
    McpInstallStatus:
      type: string
      enum: [installing, installed, error, removing]
    McpInstallSource:
      type: string
      enum: [default, market, manual]
    ApplyStatus:
      type: string
      enum: [pending, applied, failed]
    PostCategory:
      type: string
      enum: [notice, question, tip, mcp_share, app_share]

    UserRef:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string }
        departmentName: { type: [string, 'null'], description: 동명이인 구분용 표시 }
    DepartmentRef:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        pathNames: { type: array, items: { type: string }, description: "최상위부터 (예: [경영지원본부, 인사팀])" }
    Department:
      allOf:
        - $ref: '#/components/schemas/DepartmentRef'
        - type: object
          properties:
            parentId: { type: [string, 'null'], format: uuid }
            depth: { type: integer }
            sortOrder: { type: integer }
            head: { oneOf: [{ $ref: '#/components/schemas/UserRef' }, { type: 'null' }] }
            status: { type: string, enum: [active, archived] }
            memberCount: { type: integer, description: 이 부서만 }
            totalMemberCount: { type: integer, description: 하위 포함 }
    DepartmentNode:
      allOf:
        - $ref: '#/components/schemas/Department'
        - type: object
          properties:
            children:
              type: array
              items: { $ref: '#/components/schemas/DepartmentNode' }
    DepartmentInput:
      type: object
      properties:
        name: { type: string }
        code: { type: string }
        parentId: { type: [string, 'null'], format: uuid }
        headUserId: { type: [string, 'null'], format: uuid }
        sortOrder: { type: integer }
    ImportJob:
      type: object
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [departments, users] }
        status: { type: string, enum: [previewed, applied, cancelled] }
        fileName: { type: string }
        summary:
          type: object
          properties:
            added: { type: integer }
            updated: { type: integer }
            unchanged: { type: integer }
            errors: { type: integer }
        rows:
          type: array
          items:
            type: object
            properties:
              line: { type: integer }
              action: { type: string, enum: [add, update, unchanged, error] }
              key: { type: string, description: code 또는 email }
              changes: { type: object, description: "바뀌는 칸 {field: [before, after]}" }
              error: { type: [string, 'null'] }
    Actor:
      type: object
      description: kind=agent 이면 user 는 null ("에이전트(팀)" — OpenClaw 가 MCP 호출자 신원을 넘기지 않음, spike 05)
      properties:
        kind: { type: string, enum: [user, agent, system] }
        user: { oneOf: [{ $ref: '#/components/schemas/UserRef' }, { type: 'null' }] }
    Me:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        name: { type: string }
        platformRole: { $ref: '#/components/schemas/PlatformRole' }
        department: { oneOf: [{ $ref: '#/components/schemas/DepartmentRef' }, { type: 'null' }] }
        title: { type: [string, 'null'] }
        mustChangePassword: { type: boolean }
        csrfToken: { type: string }
    MyTeam:
      type: object
      properties:
        name: { type: string }
        displayName: { type: string }
        teamRole: { $ref: '#/components/schemas/TeamRole' }
        containerStatus: { $ref: '#/components/schemas/TeamContainerStatus' }
        url: { type: string, examples: ['https://team1.kacp.cloud'] }
    SessionInfo:
      type: object
      properties:
        id: { type: string }
        current: { type: boolean }
        createdAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        ip: { type: string }
        userAgent: { type: string }
    Notification:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { type: string }
        title: { type: string }
        link: { type: string }
        createdAt: { type: string, format: date-time }
        readAt: { type: [string, 'null'], format: date-time }
    ResourceLimits:
      type: object
      properties:
        cpu: { type: number, description: vCPU }
        memoryMb: { type: integer }
        diskGb: { type: integer }
    TeamStatus:
      type: object
      properties:
        status: { $ref: '#/components/schemas/TeamContainerStatus' }
        detail: { type: [string, 'null'] }
        activeUsers: { type: integer }
        since: { type: string, format: date-time }
    TeamAgent:
      type: object
      properties:
        template: { $ref: '#/components/schemas/AgentTemplateSummary' }
        templateVersion: { type: integer }
        appliedVersion: { type: [integer, 'null'] }
        applyStatus: { $ref: '#/components/schemas/ApplyStatus' }
        applyError: { type: [string, 'null'] }
    TeamDetail:
      type: object
      properties:
        name: { type: string }
        displayName: { type: string }
        url: { type: string }
        myRole: { $ref: '#/components/schemas/TeamRole' }
        status: { $ref: '#/components/schemas/TeamStatus' }
        agents:
          type: array
          items: { $ref: '#/components/schemas/TeamAgent' }
        resourceLimits: { $ref: '#/components/schemas/ResourceLimits' }
    Member:
      type: object
      properties:
        user: { $ref: '#/components/schemas/UserRef' }
        teamRole: { $ref: '#/components/schemas/TeamRole' }
        addedAt: { type: string, format: date-time }

    DriveRef:
      type: object
      required: [space, path]
      properties:
        space: { $ref: '#/components/schemas/Space' }
        path: { type: string }
    DriveTransfer:
      type: object
      required: [from, to]
      properties:
        from:
          type: array
          items: { $ref: '#/components/schemas/DriveRef' }
        to: { $ref: '#/components/schemas/DriveRef' }
    DriveEntry:
      type: object
      properties:
        name: { type: string }
        path: { type: string }
        space: { $ref: '#/components/schemas/Space' }
        isDir: { type: boolean }
        size: { type: integer }
        mimeType: { type: string }
        modifiedAt: { type: string, format: date-time }
        createdBy: { $ref: '#/components/schemas/Actor' }
    DriveMeta:
      allOf:
        - $ref: '#/components/schemas/DriveEntry'
        - type: object
          properties:
            createdAt: { type: [string, 'null'], format: date-time }
            access: { type: string, enum: [only_me, team] }
            history:
              type: array
              items:
                type: object
                properties:
                  action: { type: string }
                  actor: { $ref: '#/components/schemas/Actor' }
                  path: { type: string }
                  prevPath: { type: [string, 'null'] }
                  at: { type: string, format: date-time }
    TrashItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        space: { $ref: '#/components/schemas/Space' }
        originalPath: { type: string }
        isDir: { type: boolean }
        size: { type: integer }
        deletedBy: { $ref: '#/components/schemas/UserRef' }
        deletedAt: { type: string, format: date-time }
        purgeAfter: { type: string, format: date-time }

    AppCopy:
      type: object
      description: 앱의 한 사본(작업본 또는 공개본)
      properties:
        kind: { $ref: '#/components/schemas/AppCopyKind' }
        url: { type: string }
        status: { $ref: '#/components/schemas/AppStatus' }
        stopReason: { oneOf: [{ $ref: '#/components/schemas/StopReason' }, { type: 'null' }] }
        statusDetail: { type: [string, 'null'] }
        lastAccessedAt: { type: [string, 'null'], format: date-time }
        usage:
          type: object
          properties:
            cpuPct: { type: number }
            memBytes: { type: integer }
            memLimitBytes: { type: integer }
    PublicCopy:
      allOf:
        - $ref: '#/components/schemas/AppCopy'
        - type: object
          properties:
            name: { type: string }
            version: { type: integer }
            publishedAt: { type: string, format: date-time }
            approvedBy: { $ref: '#/components/schemas/UserRef' }
    App:
      type: object
      properties:
        id: { type: string, format: uuid }
        team: { type: string }
        slug: { type: string }
        creator: { $ref: '#/components/schemas/Actor' }
        work: { $ref: '#/components/schemas/AppCopy' }
        public:
          oneOf: [{ $ref: '#/components/schemas/PublicCopy' }, { type: 'null' }]
          description: null = 미공개
        pendingRequest:
          oneOf:
            - type: object
              properties:
                id: { type: string, format: uuid }
                kind: { $ref: '#/components/schemas/DeployRequestKind' }
            - type: 'null'
    AppDetail:
      allOf:
        - $ref: '#/components/schemas/App'
        - type: object
          properties:
            source: { $ref: '#/components/schemas/DriveRef' }
            runSpec:
              type: object
              properties:
                command: { type: string }
                port: { type: integer }
                runtime: { type: string, enum: [node, python, static] }
            resourceLimits: { $ref: '#/components/schemas/ResourceLimits' }
            dataUsage:
              type: object
              properties:
                workBytes: { type: integer }
                publicBytes: { type: [integer, 'null'] }
            currentRequest: { oneOf: [{ $ref: '#/components/schemas/DeployRequest' }, { type: 'null' }] }
            history:
              type: array
              items: { $ref: '#/components/schemas/DeployRequest' }
            canManage: { type: boolean, description: "삭제·공개 중지 가능 여부(팀 관리자). 시작·중지·공개 요청은 팀원 전체 가능" }
    PublicAppSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string, description: 공개 이름(= 호스트) }
        slug: { type: string, description: "팀 안 앱 이름(카드 제목으로 표시, apps에 별도 title 칼럼 없음)" }
        team: { type: string }
        url: { type: string, description: "https://{name}.kacp.cloud" }
        version: { type: integer }
    DeployRequest:
      type: object
      properties:
        id: { type: string, format: uuid }
        appId: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/DeployRequestKind' }
        requestedName: { type: [string, 'null'], description: publish일 때만 }
        reason: { type: string }
        fromVersion: { type: [integer, 'null'] }
        approvedVersion: { type: [integer, 'null'] }
        diffSummary:
          oneOf:
            - type: object
              properties:
                added: { type: array, items: { type: string } }
                modified: { type: array, items: { type: string } }
                removed: { type: array, items: { type: string } }
            - type: 'null'
        status: { $ref: '#/components/schemas/DeployRequestStatus' }
        requestedBy: { $ref: '#/components/schemas/UserRef' }
        requestedAt: { type: string, format: date-time }
        decidedBy: { oneOf: [{ $ref: '#/components/schemas/UserRef' }, { type: 'null' }] }
        decidedAt: { type: [string, 'null'], format: date-time }
        decisionNote: { type: [string, 'null'] }
    Series:
      type: object
      properties:
        points:
          type: array
          items:
            type: object
            properties:
              ts: { type: string, format: date-time }
              cpuPct: { type: number }
              memBytes: { type: integer }
              diskBytes: { type: integer }

    McpTool:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        inputSchema: { type: object }
    McpManifest:
      type: object
      description: platform-plugin.yaml 파싱 결과
      properties:
        name: { type: string }
        version: { type: string }
        displayName: { type: string }
        summary: { type: string }
        category: { type: string }
        secrets:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              scope: { type: string, enum: [team, user] }
              description: { type: string }
              required: { type: boolean }
        network:
          type: array
          items: { type: string, description: 허용 도메인 }
        resources: { $ref: '#/components/schemas/ResourceLimits' }
        examples:
          type: array
          items: { type: string }
    McpPackageSummary:
      type: object
      properties:
        name: { type: string }
        displayName: { type: string }
        summary: { type: string }
        category: { type: string }
        icon: { type: string }
        owner: { $ref: '#/components/schemas/UserRef' }
        status: { type: string, enum: [active, suspended] }
        isDefault: { type: boolean }
        isPlatform: { type: boolean }
        latestVersion: { type: [string, 'null'] }
        installCount: { type: integer }
        installedInTeam: { type: boolean }
    McpPackageDetail:
      allOf:
        - $ref: '#/components/schemas/McpPackageSummary'
        - type: object
          properties:
            readme: { type: string }
            manifest: { $ref: '#/components/schemas/McpManifest' }
            tools:
              type: array
              items: { $ref: '#/components/schemas/McpTool' }
            versions:
              type: array
              items:
                type: object
                properties:
                  version: { type: string }
                  publishedAt: { type: string, format: date-time }
    McpVersion:
      type: object
      properties:
        id: { type: string, format: uuid }
        packageName: { type: string }
        version: { type: string }
        status: { $ref: '#/components/schemas/McpVersionStatus' }
        failedStage: { type: [string, 'null'], enum: [validate, build, scan, test, null] }
        uploadedBy: { $ref: '#/components/schemas/UserRef' }
        uploadedAt: { type: string, format: date-time }
        manifest: { $ref: '#/components/schemas/McpManifest' }
        scanSummary:
          type: object
          properties:
            critical: { type: integer }
            high: { type: integer }
            medium: { type: integer }
            low: { type: integer }
        tools:
          type: array
          items: { $ref: '#/components/schemas/McpTool' }
        reviewNote: { type: [string, 'null'] }
    McpInstall:
      type: object
      properties:
        id: { type: string, format: uuid }
        source: { $ref: '#/components/schemas/McpInstallSource' }
        name: { type: string, description: 패키지 표시 이름 또는 직접 추가 이름 }
        packageName: { type: [string, 'null'] }
        version: { type: [string, 'null'] }
        manualUrl: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/McpInstallStatus' }
        statusDetail: { type: [string, 'null'] }
        secretNames: { type: array, items: { type: string } }
        installedBy: { $ref: '#/components/schemas/UserRef' }
        lastCheckedAt: { type: [string, 'null'], format: date-time }

    PostInput:
      type: object
      required: [category, title, bodyMd]
      properties:
        category: { $ref: '#/components/schemas/PostCategory' }
        title: { type: string, maxLength: 200 }
        bodyMd: { type: string }
        attachedPackage: { type: [string, 'null'] }
        attachedAppId: { type: [string, 'null'], format: uuid }
    PostSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        category: { $ref: '#/components/schemas/PostCategory' }
        title: { type: string }
        author: { $ref: '#/components/schemas/UserRef' }
        createdAt: { type: string, format: date-time }
        hasPackage: { type: boolean }
        hasApp: { type: boolean }
    Post:
      allOf:
        - $ref: '#/components/schemas/PostSummary'
        - type: object
          properties:
            bodyMd: { type: string }
            updatedAt: { type: string, format: date-time }
            attachedPackage: { oneOf: [{ $ref: '#/components/schemas/McpPackageSummary' }, { type: 'null' }] }
            attachedApp: { oneOf: [{ $ref: '#/components/schemas/App' }, { type: 'null' }] }
            canEdit: { type: boolean }

    AdminUser:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        name: { type: string }
        department: { oneOf: [{ $ref: '#/components/schemas/DepartmentRef' }, { type: 'null' }] }
        title: { type: [string, 'null'] }
        employeeNo: { type: [string, 'null'] }
        platformRole: { $ref: '#/components/schemas/PlatformRole' }
        status: { type: string, enum: [active, disabled] }
        mustChangePassword: { type: boolean }
        teams:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              teamRole: { $ref: '#/components/schemas/TeamRole' }
        lastLoginAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
    AdminTeam:
      type: object
      properties:
        name: { type: string }
        displayName: { type: string }
        memberCount: { type: integer }
        admins:
          type: array
          items: { $ref: '#/components/schemas/UserRef' }
        agentCount: { type: integer }
        status: { $ref: '#/components/schemas/TeamStatus' }
        resourceLimits: { $ref: '#/components/schemas/ResourceLimits' }
        createdAt: { type: string, format: date-time }
    AdminTeamDetail:
      allOf:
        - $ref: '#/components/schemas/AdminTeam'
        - type: object
          properties:
            members:
              type: array
              items: { $ref: '#/components/schemas/Member' }
            agents:
              type: array
              items: { $ref: '#/components/schemas/TeamAgent' }
            usage:
              type: object
              properties:
                cpuPct: { type: number }
                memBytes: { type: integer }
                diskBytes: { type: integer }
            mcpInstalls:
              type: array
              items: { $ref: '#/components/schemas/McpInstall' }
            apps:
              type: array
              items: { $ref: '#/components/schemas/App' }
    AgentTemplateSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        icon: { type: string }
        description: { type: string }
        version: { type: integer }
    AgentTemplateInput:
      type: object
      required: [name, spec]
      properties:
        name: { type: string }
        icon: { type: string }
        description: { type: string }
        spec: { $ref: '#/components/schemas/AgentSpec' }
    AgentSpec:
      type: object
      description: |
        OpenClaw 설정 변환은 orchestrator 담당(spike 04 대응표, 03-data-model.md agent_templates).
        model.id → agents.entries.<id>.model, model.reasoning → thinkingDefault,
        instructions → 워크스페이스 AGENTS.md, skills → SKILL.md 폴더 + agents.entries.<id>.skills,
        defaultMcp → mcp.servers, tools → agents.entries.<id>.tools.
      properties:
        model:
          type: object
          properties:
            id: { type: string, description: "provider 접두사 포함 (예: anthropic/claude-sonnet-...)" }
            reasoning: { type: string, enum: [low, medium, high], description: OpenClaw thinkingDefault 로 변환 }
        instructions: { type: string, description: 워크스페이스 AGENTS.md 로 기록 }
        skills:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              source: { type: string, enum: [bundled, upload] }
              ref: { type: string }
        defaultMcp: { type: array, items: { type: string } }
        tools:
          type: object
          properties:
            allow: { type: array, items: { type: string } }
            deny: { type: array, items: { type: string } }
    AgentTemplate:
      allOf:
        - $ref: '#/components/schemas/AgentTemplateSummary'
        - type: object
          properties:
            spec: { $ref: '#/components/schemas/AgentSpec' }
            assignedTeams:
              type: array
              items:
                type: object
                properties:
                  name: { type: string }
                  applyStatus: { $ref: '#/components/schemas/ApplyStatus' }
            updatedAt: { type: string, format: date-time }
            updatedBy: { $ref: '#/components/schemas/UserRef' }
    Dashboard:
      type: object
      properties:
        teams:
          type: object
          properties:
            total: { type: integer }
            running: { type: integer }
        activeUsers: { type: integer }
        runningApps:
          type: object
          properties:
            work: { type: integer }
            public: { type: integer }
        pending:
          type: object
          properties:
            deployRequests: { type: integer }
            mcpReviews: { type: integer }
        vm:
          type: object
          properties:
            cpuPct: { type: number }
            memPct: { type: number }
            diskPct: { type: number }
        warnings:
          type: array
          items:
            type: object
            properties:
              level: { type: string, enum: [warn, danger] }
              resource: { type: string, enum: [cpu, memory, disk] }
              message: { type: string }
        teamContainers:
          type: array
          items:
            type: object
            properties:
              team: { type: string }
              status: { $ref: '#/components/schemas/TeamContainerStatus' }
              activeUsers: { type: integer }
              cpuPct: { type: number }
              memBytes: { type: integer }
              memLimitBytes: { type: integer }
              lastActiveAt: { type: [string, 'null'], format: date-time }
    PlatformSettings:
      type: object
      properties:
        models:
          type: object
          properties:
            allowed:
              type: array
              items:
                type: object
                properties:
                  id: { type: string }
                  label: { type: string }
                  provider: { type: string }
                  default: { type: boolean }
            apiKeysConfigured:
              type: object
              additionalProperties: { type: boolean }
              readOnly: true
        limits:
          type: object
          properties:
            teamDefault: { $ref: '#/components/schemas/ResourceLimits' }
            appDefault: { $ref: '#/components/schemas/ResourceLimits' }
            mcpDefault: { $ref: '#/components/schemas/ResourceLimits' }
        ops:
          type: object
          properties:
            idleStopMinutes: { type: integer, description: 팀 컨테이너 }
            appIdleStopMinutes:
              type: object
              properties:
                work: { type: integer }
                public: { type: integer }
            maxRunningWorkAppsPerTeam: { type: integer }
            capacityWarn:
              type: object
              properties:
                cpu: { type: integer }
                memory: { type: integer }
                disk: { type: integer }
            trashRetentionDays: { type: integer }
        names:
          type: object
          properties:
            reserved: { type: array, items: { type: string }, readOnly: true }
            reservedExtra: { type: array, items: { type: string } }
    AuditEvent:
      type: object
      properties:
        id: { type: integer }
        at: { type: string, format: date-time }
        actor: { oneOf: [{ $ref: '#/components/schemas/UserRef' }, { type: 'null' }] }
        action: { type: string }
        targetType: { type: string }
        targetId: { type: string }
        targetLabel: { type: string }
        team: { type: [string, 'null'] }
        detail: { type: object }
        ip: { type: [string, 'null'] }
